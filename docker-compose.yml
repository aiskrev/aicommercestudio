# A.I. Commerce Studio — local stack (production-like images, localhost only).
#   docker compose up --build -d            -> db + api + web
#   docker compose --profile test run --rm api-tests
#   docker compose --profile test run --rm web-tests
#   docker compose --profile test run --rm e2e
# Hot-reload development: add -f docker-compose.yml -f docker-compose.dev.yml
# Production overrides:    add -f docker-compose.yml -f infra/docker-compose.prod.yml

name: ai-commerce-studio

x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-acs}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run scripts/setup.ps1)}@db:5432/${POSTGRES_DB:-acs}

# Docker's default json-file driver never rotates; cap each container's logs (≈ 50 MB).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    logging: *logging
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-acs}
      POSTGRES_USER: ${POSTGRES_USER:-acs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    logging: *logging
    build:
      context: ./apps/api
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *api-env
      RUN_MIGRATIONS_ON_START: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    logging: *logging
    build:
      context: ./apps/web
      target: runner
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
        PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:-}
        PUBLIC_CONTACT_PHONE: ${PUBLIC_CONTACT_PHONE:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      # Enables POST /api/catalogue-revalidate (on-demand regeneration of the catalogue pages); empty = disabled.
      CATALOGUE_REVALIDATE_SECRET: ${CATALOGUE_REVALIDATE_SECRET:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ---------------------------------------------------------------- test profile
  api-tests:
    profiles: ["test"]
    build:
      context: ./apps/api
      target: dev
    env_file: .env
    environment:
      <<: *api-env
      APP_ENV: test
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-q"]

  web-tests:
    profiles: ["test"]
    build:
      context: ./apps/web
      target: dev
    command: ["sh", "-c", "npm run typecheck && npm run lint && npm test"]

  e2e:
    profiles: ["test"]
    build:
      context: ./apps/web/e2e
    env_file: .env
    environment:
      E2E_BASE_URL: http://web:3000
      CATALOGUE_REVALIDATE_SECRET: ${CATALOGUE_REVALIDATE_SECRET:-}
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./apps/web/e2e/playwright-report:/e2e/playwright-report

volumes:
  pgdata:
