# External TLS check of the public hostnames (audit TLS-01). Weekly and on demand: TLS 1.0/1.1 rejected, TLS 1.2/1.3
# accepted, certificate trusted and valid for more than 21 days, HSTS present (scripts/verify-tls.sh). The run fails
# on a violation and also on an inconclusive result, so a check that could not run never looks like a pass; GitHub
# e-mails the repository owner. A handful of handshakes per hostname: no scanning.
name: TLS check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify the TLS posture of the public hostnames
        run: bash scripts/verify-tls.sh ai-commercestudio.com www.ai-commercestudio.com
