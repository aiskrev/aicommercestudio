# Dependency vulnerability audit (scripts/test.ps1 -Suite audit). Weekly and on demand, not on every
# pull request: new advisories can appear without any code change.
name: Dependency audit

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  audit:
    name: pip-audit + npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate local .env
        run: ./scripts/setup.ps1 6>$null | Out-Null
      - name: Run audit suite
        run: ./scripts/test.ps1 -Suite audit
